<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Poshan Darpan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-circle">
          <i class="ph-fill ph-bowl-food"></i>
        </div>
        <h1 class="auth-title-hi">पोषण दर्पण</h1>
        <div class="auth-title-en">POSHAN DARPAN</div>
        <p class="auth-subtitle">Mid-Day Meal Monitoring Platform</p>
      </div>

      <div id="loginError" class="auth-error" role="alert"></div>

      <form class="auth-form" id="loginForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <i class="ph ph-envelope input-icon"></i>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="ph ph-lock input-icon"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required />
            <button type="button" class="pwd-toggle" data-target="password" aria-label="Show password">
              <i class="ph ph-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Login
          <i class="ph ph-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="register.html">Register here</a>
      </p>

      <div class="demo-box">
        <strong>Demo Credentials</strong>
        <p><b>School:</b> rajesh@school.com / school123</p>
        <p><b>Govt:</b> sanjay@gov.com / gov123</p>
      </div>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initDataStore();
    checkExistingSession();

    document.addEventListener("DOMContentLoaded", () => {
      setupPasswordToggle();
      const form = document.getElementById("loginForm");
      if (form) form.addEventListener("submit", handleLogin);
    });
  </script>
</body>
</html>
