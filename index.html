<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Poshan Darpan</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
</head>
<body>
  <div id="toast-container"></div>

  <main class="auth-page">
    <div class="auth-card" id="login-card">
      <!-- Loading overlay -->
      <div class="auth-spinner-overlay" id="spinner">
        <div class="spinner"></div>
        <p>Signing you in…</p>
      </div>

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="ph-bold ph-bowl-food"></i>
        </div>
        <h1>Poshan Darpan</h1>
        <p class="tagline">पोषण दर्पण — Nutrition Mirror</p>
      </div>

      <!-- Form -->
      <form class="auth-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pwd-wrap">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <span class="pwd-toggle" id="toggle-pwd" title="Show/Hide password">
              <i class="ph-bold ph-eye" id="toggle-pwd-icon"></i>
            </span>
          </div>
          <span class="form-error" id="password-error"></span>
        </div>

        <div class="forgot-link">
          <a href="#" id="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <i class="ph-bold ph-sign-in"></i>
          Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
