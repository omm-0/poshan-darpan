<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed Database — Poshan Darpan</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    body { max-width: 640px; margin: 2rem auto; padding: 1.5rem; font-family: 'Inter', sans-serif; }
    .log-entry { padding: 0.4rem 0; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; }
    .log-ok  { color: #059669; }
    .log-err { color: #DC2626; }
    code { background:#f1f5f9; padding:0.15rem 0.35rem; border-radius:4px; font-size:0.85em; }
  </style>

  <!-- Firebase Compat SDK (works with regular script tags, no modules needed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1 style="margin-bottom:0.5rem">Poshan Darpan — Seed Data</h1>
  <p style="color:#64748b;margin-bottom:1.5rem">
    This tool pre-populates Firestore with sample schools, attendance, and alerts.
    <strong>Run this only once on a fresh Firebase project.</strong>
  </p>

  <div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:1rem;margin-bottom:1.5rem;font-size:0.875rem">
    <strong>Requirements:</strong> Firestore must be in <strong>test mode</strong> (allows all reads/writes).
    Open via Live Server at <code>http://127.0.0.1:5500</code> — not as a local file.
  </div>

  <button
    style="background:#2563EB;color:#fff;border:none;padding:0.65rem 1.5rem;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer"
    id="seed-btn"
    onclick="runSeed()"
  >
    Seed Database
  </button>
  <button
    style="background:#f1f5f9;border:1px solid #e2e8f0;padding:0.65rem 1.25rem;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-left:0.75rem"
    onclick="document.getElementById('log').innerHTML=''"
  >
    Clear Log
  </button>

  <div id="log" style="margin-top:1.5rem"></div>

  <script>
    // ── Firebase config (same values as firebase-config.js) ──────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBolmvK_ICxHPgMxGqvFWjgG6ZT4j_iREk",
      authDomain: "poshan-darpan-4b312.firebaseapp.com",
      projectId: "poshan-darpan-4b312",
      storageBucket: "poshan-darpan-4b312.firebasestorage.app",
      messagingSenderId: "693623059136",
      appId: "1:693623059136:web:6da7666c30d0d634353325"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function log(msg, type = 'ok') {
      const el = document.getElementById('log');
      el.innerHTML += `<div class="log-entry log-${type}">${type === 'ok' ? '✓' : '✗'} ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    async function runSeed() {
      const btn = document.getElementById('seed-btn');
      btn.disabled = true;
      btn.textContent = 'Seeding…';

      try {
        // ── Schools ────────────────────────────────────────────────────────
        const schools = [
          {
            id: 'school_ujjain',
            data: {
              name: 'Government Primary School, Ujjain',
              enrollment: 250,
              district: 'Ujjain',
              status: 'active',
              contactPerson: 'Ramesh Sharma',
              contactEmail: 'ramesh@school-ujjain.edu.in',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            },
            inventory: {
              rice:  { current: 80,  max: 200 },
              wheat: { current: 60,  max: 150 },
              dal:   { current: 15,  max: 50  },
              lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }
          },
          {
            id: 'school_indore',
            data: {
              name: 'Government Middle School, Indore',
              enrollment: 400,
              district: 'Indore',
              status: 'active',
              contactPerson: 'Sunita Patel',
              contactEmail: 'sunita@school-indore.edu.in',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            },
            inventory: {
              rice:  { current: 150, max: 300 },
              wheat: { current: 120, max: 250 },
              dal:   { current: 35,  max: 80  },
              lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }
          },
          {
            id: 'school_bhopal',
            data: {
              name: 'Government High School, Bhopal',
              enrollment: 600,
              district: 'Bhopal',
              status: 'active',
              contactPerson: 'Vikram Singh',
              contactEmail: 'vikram@school-bhopal.edu.in',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            },
            inventory: {
              rice:  { current: 30,  max: 400 },
              wheat: { current: 200, max: 350 },
              dal:   { current: 8,   max: 100 },
              lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }
          }
        ];

        for (const s of schools) {
          await db.collection('schools').doc(s.id).set(s.data);
          log(`School created: ${s.data.name}`);
          await db.collection('schools').doc(s.id).collection('inventory').doc('stock').set(s.inventory);
          log(`Inventory set for: ${s.data.name}`);
        }

        // ── Attendance Records (10 per school, last 10 days) ───────────────
        let attCount = 0;
        for (const s of schools) {
          for (let i = 1; i <= 10; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            const studentsPresent = Math.floor(s.data.enrollment * (0.7 + Math.random() * 0.25));
            await db.collection('attendance').add({
              schoolId: s.id,
              date: dateStr,
              studentsPresent,
              riceUsed:  parseFloat((studentsPresent * 0.1).toFixed(3)),
              wheatUsed: parseFloat((studentsPresent * 0.1).toFixed(3)),
              dalUsed:   parseFloat((studentsPresent * 0.03).toFixed(3)),
              timestamp: firebase.firestore.Timestamp.fromDate(d),
              submittedBy: 'seed-script'
            });
            attCount++;
          }
        }
        log(`Attendance records created: ${attCount}`);

        // ── Alerts ─────────────────────────────────────────────────────────
        const alerts = [
          {
            schoolId: 'school_ujjain',
            schoolName: 'Government Primary School, Ujjain',
            type: 'stock', severity: 'warning', item: 'dal',
            title: 'Warning: dal stock below 20%',
            message: 'Dal stock is at 30% (15kg remaining). Please restock soon.',
            status: 'active',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            resolvedAt: null
          },
          {
            schoolId: 'school_bhopal',
            schoolName: 'Government High School, Bhopal',
            type: 'stock', severity: 'critical', item: 'rice',
            title: 'Critical: rice stock below 10%',
            message: 'Rice stock is at 8% (30kg remaining). Immediate restocking required.',
            status: 'active',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            resolvedAt: null
          },
          {
            schoolId: 'school_bhopal',
            schoolName: 'Government High School, Bhopal',
            type: 'stock', severity: 'critical', item: 'dal',
            title: 'Critical: dal stock below 10%',
            message: 'Dal stock is at 8% (8kg remaining). Immediate restocking required.',
            status: 'active',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            resolvedAt: null
          }
        ];

        for (const alert of alerts) {
          await db.collection('alerts').add(alert);
        }
        log(`Alerts created: ${alerts.length}`);

        log('🎉 Seeding complete!');
        document.getElementById('log').innerHTML += `
          <div style="margin-top:1rem;padding:1rem;background:#D1FAE5;border:1px solid #6EE7B7;border-radius:8px;font-size:0.875rem;line-height:1.8">
            <strong>✅ Now register these users via the app's Register page:</strong><br/>
            📧 school1@poshan.com / password123 → School Admin → <em>Government Primary School, Ujjain</em><br/>
            📧 school2@poshan.com / password123 → School Admin → <em>Government Middle School, Indore</em><br/>
            📧 school3@poshan.com / password123 → School Admin → <em>Government High School, Bhopal</em><br/>
            📧 gov@poshan.com / password123 → Government Official → Madhya Pradesh<br/>
          </div>
        `;

      } catch (e) {
        log(`Error: ${e.message}`, 'err');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Seed Database';
      }
    }
  </script>
</body>
</html>
