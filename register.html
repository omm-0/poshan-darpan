<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Poshan Darpan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card register-card">
      <div class="auth-header">
        <div class="auth-logo-circle">
          <i class="ph-fill ph-user-plus"></i>
        </div>
        <h1 class="auth-title-hi">Create Account</h1>
        <div class="auth-title-en">पोषण दर्पण</div>
        <p class="auth-subtitle">Join Poshan Darpan to monitor mid-day meals</p>
      </div>

      <form class="auth-form" id="registerForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-with-icon">
            <i class="ph ph-user input-icon"></i>
            <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required />
          </div>
          <span class="field-error" id="err-name"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <i class="ph ph-envelope input-icon"></i>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required />
          </div>
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="ph ph-lock input-icon"></i>
            <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" required />
            <button type="button" class="pwd-toggle" data-target="password" aria-label="Show password">
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <span class="field-error" id="err-password"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-with-icon">
            <i class="ph ph-lock-key input-icon"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Re-enter password" required />
            <button type="button" class="pwd-toggle" data-target="confirmPassword" aria-label="Show password">
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <span class="field-error" id="err-confirm"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role</label>
          <select id="role" name="role" class="form-select" required>
            <option value="">Select your role...</option>
            <option value="school">School Administrator</option>
            <option value="government">Government Official</option>
          </select>
          <span class="field-error" id="err-role"></span>
        </div>

        <div class="conditional-field" id="schoolFieldWrap">
          <div class="form-group">
            <label class="form-label" for="schoolId">Your School</label>
            <select id="schoolId" name="schoolId" class="form-select">
              <option value="">Select your school...</option>
            </select>
            <span class="field-error" id="err-school"></span>
          </div>
        </div>

        <div class="conditional-field" id="districtFieldWrap">
          <div class="form-group">
            <label class="form-label" for="district">District</label>
            <div class="input-with-icon">
              <i class="ph ph-map-pin input-icon"></i>
              <input type="text" id="district" name="district" class="form-input" placeholder="Enter your district" />
            </div>
            <span class="field-error" id="err-district"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account
          <i class="ph ph-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="index.html">Login here</a>
      </p>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initDataStore();
    checkExistingSession();

    document.addEventListener("DOMContentLoaded", () => {
      populateSchoolDropdown();
      setupPasswordToggle();
      setupRoleFieldToggle();
      setupInlineErrorClear();
      const form = document.getElementById("registerForm");
      if (form) form.addEventListener("submit", handleRegister);
    });
  </script>
</body>
</html>
