<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Poshan Darpan</title>
    <!-- Firebase Compat (works on file:// AND any server, no ES modules needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- UI libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=Epilogue:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Epilogue', sans-serif;
            background: #FFF9E6;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .dot {
            background-image: radial-gradient(#FDBA7455 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .role-card {
            border: 2px solid #FFEDD5;
            transition: all .2s;
            cursor: pointer;
            border-radius: .875rem;
            padding: 1rem;
        }

        .role-card.sel {
            border-color: #EA580C;
            background: #FFF7ED;
        }

        input,
        select {
            font-family: 'Epilogue', sans-serif;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-6px)
            }

            60% {
                transform: translateX(6px)
            }
        }

        .shake {
            animation: shake .35s ease;
        }

        #app {
            display: none;
            width: 100%;
            max-width: 420px;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: #FFF9E6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            z-index: 999;
        }
    </style>
</head>

<body class="dot">
    <!-- Loading screen -->
    <div id="loader">
        <div
            style="width:52px;height:52px;background:#EA580C;border-radius:1rem;display:flex;align-items:center;justify-content:center">
            <i class="ph ph-bowl-food" style="color:white;font-size:1.75rem"></i>
        </div>
        <span style="font-family:'Epilogue',sans-serif;color:#9ca3af;font-size:.875rem">Loading...</span>
    </div>

    <!-- Login card -->
    <div id="app" style="width:100%;max-width:420px">
        <div style="text-align:center;margin-bottom:1.5rem">
            <div
                style="width:60px;height:60px;background:#EA580C;border-radius:1.25rem;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -4px rgba(234,88,12,.5);margin-bottom:.875rem">
                <i class="ph ph-bowl-food" style="color:white;font-size:2rem"></i>
            </div>
            <h1
                style="font-family:'Bricolage Grotesque',sans-serif;font-size:1.875rem;font-weight:800;color:#431407;margin:0">
                Poshan Darpan</h1>
            <p style="font-family:'Epilogue',sans-serif;color:#9ca3af;font-size:.875rem;margin:.25rem 0 0">Mid-Day Meal
                Analytics Portal</p>
        </div>

        <div
            style="background:white;border-radius:1.5rem;padding:1.75rem;box-shadow:0 12px 40px -8px rgba(253,186,116,.3);border:1px solid #FFEDD5">
            <!-- Role selector -->
            <p
                style="font-size:.7rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin:0 0 .75rem">
                Select your role</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.625rem;margin-bottom:1.25rem">
                <div class="role-card sel" id="rc-school" onclick="selRole('school')">
                    <div
                        style="width:2rem;height:2rem;background:#FFF7ED;border-radius:.5rem;display:flex;align-items:center;justify-content:center;margin-bottom:.5rem">
                        <i class="ph ph-chalkboard-teacher" style="color:#EA580C;font-size:1.1rem"></i>
                    </div>
                    <p style="font-weight:700;font-size:.85rem;color:#431407;margin:0">School Admin</p>
                    <p style="color:#9ca3af;font-size:.7rem;margin:.125rem 0 0">Submit attendance</p>
                </div>
                <div class="role-card" id="rc-gov" onclick="selRole('gov')">
                    <div
                        style="width:2rem;height:2rem;background:#FFF7ED;border-radius:.5rem;display:flex;align-items:center;justify-content:center;margin-bottom:.5rem">
                        <i class="ph ph-buildings" style="color:#EA580C;font-size:1.1rem"></i>
                    </div>
                    <p style="font-weight:700;font-size:.85rem;color:#431407;margin:0">Govt Officer</p>
                    <p style="color:#9ca3af;font-size:.7rem;margin:.125rem 0 0">State analytics</p>
                </div>
            </div>

            <!-- Email -->
            <div style="margin-bottom:.875rem">
                <label style="display:block;font-size:.8rem;font-weight:600;color:#6b7280;margin-bottom:.375rem">Email
                    Address</label>
                <div style="position:relative">
                    <i class="ph ph-envelope"
                        style="position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#d1d5db;font-size:1.1rem"></i>
                    <input type="email" id="emailIn" placeholder="you@gov.in"
                        style="width:100%;background:#F9FAFB;border:2px solid #F3F4F6;border-radius:.75rem;padding:.75rem .875rem .75rem 2.75rem;font-size:.9rem;color:#431407;outline:none;box-sizing:border-box;transition:border .2s"
                        onfocus="this.style.borderColor='#EA580C'" onblur="this.style.borderColor='#F3F4F6'"
                        onkeydown="if(event.key==='Enter')document.getElementById('pwdIn').focus()">
                </div>
            </div>

            <!-- Password -->
            <div style="margin-bottom:1rem">
                <label
                    style="display:block;font-size:.8rem;font-weight:600;color:#6b7280;margin-bottom:.375rem">Password</label>
                <div style="position:relative">
                    <i class="ph ph-lock-simple"
                        style="position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#d1d5db;font-size:1.1rem"></i>
                    <input type="password" id="pwdIn" placeholder="••••••••"
                        style="width:100%;background:#F9FAFB;border:2px solid #F3F4F6;border-radius:.75rem;padding:.75rem 2.75rem .75rem 2.75rem;font-size:.9rem;color:#431407;outline:none;box-sizing:border-box;transition:border .2s"
                        onfocus="this.style.borderColor='#EA580C'" onblur="this.style.borderColor='#F3F4F6'"
                        onkeydown="if(event.key==='Enter')doLogin()">
                    <button type="button" onclick="togglePwd()"
                        style="position:absolute;right:.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#d1d5db;font-size:1.1rem;padding:0;display:flex">
                        <i class="ph ph-eye" id="eyeIco"></i>
                    </button>
                </div>
            </div>

            <!-- Error -->
            <div id="errBox"
                style="display:none;align-items:center;gap:.5rem;background:#FEF2F2;border:1px solid #FECACA;border-radius:.75rem;padding:.75rem .875rem;margin-bottom:1rem">
                <i class="ph ph-warning-circle" style="color:#DC2626;font-size:1.1rem;flex-shrink:0"></i>
                <span id="errMsg" style="font-size:.85rem;font-weight:600;color:#991B1B"></span>
            </div>

            <!-- Submit -->
            <button id="loginBtn" onclick="doLogin()"
                style="width:100%;background:#EA580C;color:white;border:none;border-radius:.75rem;padding:.875rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Epilogue',sans-serif;display:flex;align-items:center;justify-content:center;gap:.5rem;box-shadow:0 4px 16px -4px rgba(234,88,12,.6);transition:background .2s"
                onmouseover="this.style.background='#c24106'" onmouseout="this.style.background='#EA580C'">
                <span id="btnTxt">Sign In</span>
                <i class="ph ph-arrow-right" id="btnIco" style="font-size:1.1rem"></i>
            </button>

            <!-- Demo creds -->
            <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid #F3F4F6">
                <p
                    style="font-size:.7rem;font-weight:700;color:#d1d5db;text-transform:uppercase;letter-spacing:.1em;margin:0 0 .625rem">
                    Quick Demo Login</p>
                <div onclick="fill('school@poshan.gov.in','school123','school')"
                    style="display:flex;align-items:center;justify-content:space-between;background:#F9FAFB;border-radius:.75rem;padding:.625rem .875rem;cursor:pointer;margin-bottom:.375rem;transition:background .2s"
                    onmouseover="this.style.background='#FFF7ED'" onmouseout="this.style.background='#F9FAFB'">
                    <div>
                        <p style="font-weight:700;font-size:.8rem;color:#431407;margin:0">🏫 School Admin</p>
                        <p style="font-size:.7rem;color:#9ca3af;margin:.1rem 0 0;font-family:monospace">
                            school@poshan.gov.in · school123</p>
                    </div>
                    <i class="ph ph-caret-right" style="color:#d1d5db;font-size:1rem"></i>
                </div>
                <div onclick="fill('gov@poshan.gov.in','gov12345','gov')"
                    style="display:flex;align-items:center;justify-content:space-between;background:#F9FAFB;border-radius:.75rem;padding:.625rem .875rem;cursor:pointer;transition:background .2s"
                    onmouseover="this.style.background='#FFF7ED'" onmouseout="this.style.background='#F9FAFB'">
                    <div>
                        <p style="font-weight:700;font-size:.8rem;color:#431407;margin:0">🏛️ Govt Officer</p>
                        <p style="font-size:.7rem;color:#9ca3af;margin:.1rem 0 0;font-family:monospace">
                            gov@poshan.gov.in · gov12345</p>
                    </div>
                    <i class="ph ph-caret-right" style="color:#d1d5db;font-size:1rem"></i>
                </div>
            </div>
        </div>
        <p style="text-align:center;font-size:.7rem;color:#d1d5db;margin-top:1rem;font-family:'Epilogue',sans-serif">
            Government of India · Mid-Day Meal Analytics</p>
    </div>

    <script>
        // ── Firebase init (Compat SDK — no ES modules, works everywhere) ─────────
        const firebaseConfig = {
            apiKey: "AIzaSyBRzYpEHR6rPhIlfkBssPxR03zFI5GJBB8",
            authDomain: "poshan-darpan.firebaseapp.com",
            projectId: "poshan-darpan",
            storageBucket: "poshan-darpan.firebasestorage.app",
            messagingSenderId: "355897523524",
            appId: "1:355897523524:web:4ece8290d6d55f1bf82b11"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let selRoleVal = 'school';
        let authChecked = false;   // ← only run onAuthStateChanged once

        // ── Check if already logged in ────────────────────────────────────────────
        auth.onAuthStateChanged(function (user) {
            if (authChecked) return;
            authChecked = true;

            if (user) {
                // Already logged in — redirect silently
                db.collection('users').doc(user.uid).get().then(function (snap) {
                    if (snap.exists) {
                        var role = snap.data().role;
                        if (role === 'school') window.location.replace('school-dashboard.html');
                        else if (role === 'gov') window.location.replace('gov-dashboard.html');
                        else showApp();
                    } else {
                        showApp();
                    }
                }).catch(function () { showApp(); });
            } else {
                showApp();
            }
        });

        function showApp() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        // ── Role selector ─────────────────────────────────────────────────────────
        function selRole(role) {
            selRoleVal = role;
            document.getElementById('rc-school').className = 'role-card' + (role === 'school' ? ' sel' : '');
            document.getElementById('rc-gov').className = 'role-card' + (role === 'gov' ? ' sel' : '');
        }

        function fill(email, pwd, role) {
            document.getElementById('emailIn').value = email;
            document.getElementById('pwdIn').value = pwd;
            selRole(role);
        }

        function togglePwd() {
            var i = document.getElementById('pwdIn');
            var e = document.getElementById('eyeIco');
            if (i.type === 'password') { i.type = 'text'; e.className = 'ph ph-eye-slash'; }
            else { i.type = 'password'; e.className = 'ph ph-eye'; }
        }

        // ── Login logic ────────────────────────────────────────────────────────────
        function showErr(msg) {
            var box = document.getElementById('errBox');
            document.getElementById('errMsg').textContent = msg;
            box.style.display = 'flex';
            document.getElementById('app').classList.add('shake');
            setTimeout(function () { document.getElementById('app').classList.remove('shake'); }, 400);
        }

        function clearErr() { document.getElementById('errBox').style.display = 'none'; }

        function setLoading(on) {
            var btn = document.getElementById('loginBtn');
            var txt = document.getElementById('btnTxt');
            var ico = document.getElementById('btnIco');
            btn.disabled = on;
            txt.textContent = on ? 'Signing in...' : 'Sign In';
            ico.className = on ? 'ph ph-spinner-gap' : 'ph ph-arrow-right';
            if (on) {
                ico.style.animation = 'spin 1s linear infinite';
            } else {
                ico.style.animation = '';
            }
            btn.style.background = on ? '#9ca3af' : '#EA580C';
            btn.style.cursor = on ? 'not-allowed' : 'pointer';
        }

        function doLogin() {
            clearErr();
            var email = document.getElementById('emailIn').value.trim();
            var pwd = document.getElementById('pwdIn').value;

            if (!email) { showErr('Please enter your email.'); return; }
            if (!pwd) { showErr('Please enter your password.'); return; }

            setLoading(true);

            auth.signInWithEmailAndPassword(email, pwd).then(function (cred) {
                return db.collection('users').doc(cred.user.uid).get();
            }).then(function (snap) {
                if (!snap.exists) {
                    setLoading(false);
                    showErr('Account not set up. Please run the seed script first.');
                    return;
                }
                var role = snap.data().role;
                if (role === 'school') window.location.replace('school-dashboard.html');
                else if (role === 'gov') window.location.replace('gov-dashboard.html');
                else { setLoading(false); showErr('Unrecognised role. Contact admin.'); }
            }).catch(function (err) {
                setLoading(false);
                var MAP = {
                    'auth/invalid-credential': 'Incorrect email or password.',
                    'auth/user-not-found': 'No account with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/too-many-requests': 'Too many attempts. Wait a few minutes.',
                    'auth/network-request-failed': 'No internet connection.',
                    'auth/invalid-email': 'Invalid email address format.',
                };
                showErr(MAP[err.code] || ('Error: ' + err.message));
            });
        }
    </script>
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
</body>

</html>
