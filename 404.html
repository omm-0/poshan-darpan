<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Poshan Darpan</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
    .error-box { text-align: center; max-width: 420px; padding: 2rem; }
    .error-code { font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .error-icon { font-size: 4rem; color: var(--primary); opacity: 0.3; margin-bottom: 1rem; display: block; }
    .error-title { font-size: 1.5rem; font-weight: 700; margin: 0.5rem 0; }
    .error-msg { color: var(--text-secondary); margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="error-box">
    <i class="ph-bold ph-map-trifold error-icon"></i>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn btn-primary">
      <i class="ph-bold ph-house"></i>
      Back to Home
    </a>
  </div>
</body>
</html>
